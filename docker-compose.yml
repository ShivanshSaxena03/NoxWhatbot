version: "3.8"

services:
  jarvis-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis-whatsapp-assistant
    restart: always
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-anthropic/claude-3.5-sonnet}
      - VAULT_MASTER_KEY=${VAULT_MASTER_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3000
      - SERVER_PORT=3001
      - WA_SESSION_DIR=/app/baileys_auth_info
    volumes:
      - jarvis-wa-session:/app/baileys_auth_info

volumes:
  jarvis-wa-session:
